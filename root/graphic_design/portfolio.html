    <style>
        /* Custom CSS styles and keyframes for animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* A more elegant script font for the name with extra vertical padding to prevent clipping */
        .font-sacramento {
            font-family: 'Sacramento', cursive;
        }
        
        /* Styles for dark mode text glow on active links */
        .dark .text-white-glow {
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
        }

        /* Base font for the entire document */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Style for the PDF viewer modal overlay */
        .pdf-viewer-overlay {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
        }

        /* Define CSS custom properties for light theme */
        :root {
            --bg-color: #ffffff;
            --text-color: #1f2937;
            --header-bg: #ffffff;
            --footer-bg: #ffffff;
            --secondary-text: #6b7280;
            --link-color: #4b5563;
            --active-link-color: #000000;
        }

        /* Override CSS custom properties for dark theme */
        .dark {
            --bg-color: #0c0a09; /* Near-black for a dramatic change */
            --text-color: #f3f4f6;
            --header-bg: #1f2937;
            --footer-bg: #1f2937;
            --secondary-text: #9ca3af;
            --link-color: #d1d5db;
            --active-link-color: #ffffff;
        }
    </style>
</head>

        // Functions for the PDF Viewer Modal

            pdfFrame.src = pdfUrl;

        // Renders the portfolio items for a given category and collection
        function renderWorkItems(category, collection) {
            let filteredItems = portfolioItems.filter(item => item.category === category);
            
            // Filter by collection if not 'All'
            if (collection !== 'All') {
                filteredItems = filteredItems.filter(item => item.collection === collection);
            }

            const itemsHtml = filteredItems.map(item => {
                const isPresentation = item.category === 'Presentations' && item.pdfUrl;
                const clickHandler = isPresentation ? `onclick="openPdfViewer('${item.pdfUrl}')"` : '';
                const cursorClass = isPresentation ? 'cursor-pointer' : '';

                return `
                    <div class="relative group rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 aspect-[4/3] ${cursorClass}" ${clickHandler}>
                        <img src="${item.image}" alt="${item.title}" class="absolute inset-0 w-full h-full object-contain bg-gray-100 dark:bg-gray-900" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x300/6b7280/ffffff?text=Image+Load+Error';" />

                            <p class="text-gray-200 text-sm mt-1">${item.category}</p>
                        </div>
                    </div>
                `;
            }).join('');

            const itemsContainer = document.getElementById('work-items-container');
            if (itemsContainer) {
                itemsContainer.innerHTML = itemsHtml;
            }
        }

        // Renders the full Work page structure, including category tabs and sub-collection tabs (UPDATED)
        function renderWorkPage() {
            const categories = ['Logos', 'Concept Design', 'T-shirt Design', 'Photography', 'Presentations', 'Vectors', 'Stickers'];
            const isDark = document.documentElement.classList.contains('dark');
            const headingThemeClass = isDark ? 'from-sky-400 to-teal-400' : 'from-orange-500 via-orange-400 to-yellow-400';

            // --- 1. Render Main Category Tabs (work-tab) ---
            const tabsHtml = categories.map(category => {
                const isActive = activeWorkCategory === category;
                
                // Active gradient classes for main category buttons
                let activeClasses;
                if (isActive) {
                    if (isDark) {
                        activeClasses = 'bg-gradient-to-r from-teal-400 to-cyan-400 text-white shadow-xl transform scale-105';
                    } else {
                        activeClasses = 'bg-gradient-to-r from-orange-500 to-yellow-400 text-white shadow-xl transform scale-105';
                    }
                } else {
                    activeClasses = 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700';
                }

                return `
                    <button
                        data-category="${category}"
                        class="work-tab px-6 py-2 rounded-full font-semibold transition-all duration-300 ${activeClasses}"
                    >
                        ${category}
                    </button>
                `;
            }).join('');

            // --- 2. Determine and Render Collection Tabs (sub-collection-tab) ---
            let collectionsHtml = '';
            const itemsInActiveCategory = portfolioItems.filter(item => item.category === activeWorkCategory);
            
            const uniqueCollections = Array.from(new Set(
                itemsInActiveCategory
                    .map(item => item.collection)
                    .filter(Boolean)
            ));

            const hasCollections = uniqueCollections.length > 0;

            if (hasCollections) {
                const collections = ['All', ...uniqueCollections];

                const subTabsHtml = collections.map(collection => {
                    const isActive = activeWorkCollection === collection;
                    
                    // Active gradient classes for SUB-COLLECTION buttons
                    let subActiveClasses;
                    if (isActive) {
                        if (isDark) {
                            // Dark Mode: Teal to Cyan gradient
                            subActiveClasses = 'bg-gradient-to-r from-teal-500 to-cyan-500 text-white shadow-lg transform scale-105';
                        } else {
                            // Light Mode: Orange to Yellow gradient
                            subActiveClasses = 'bg-gradient-to-r from-orange-400 to-yellow-300 text-gray-900 shadow-lg transform scale-105';
                        }
                    } else {
                        // Inactive classes also get a slight hover effect
                        subActiveClasses = 'bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 hover:scale-[1.02]';
                    }

                    return `
                        <button
                            data-collection="${collection}"
                            class="sub-collection-tab px-3 py-1 text-sm rounded-full font-medium transition-all duration-300 w-fit text-left ${subActiveClasses}"
                        >
                            ${collection}
                        </button>
                    `;
                }).join('');

                collectionsHtml = `
                    <div id="sub-collection-tabs" class="flex flex-col space-y-2 items-start">
                        <h4 class="text-md font-bold text-[var(--text-color)] mt-2 mb-1">Collections</h4>
                        ${subTabsHtml}
                    </div>
                `;
            }

            // Layout classes
            const flexClass = hasCollections ? 'md:flex-row' : 'md:flex-row justify-center';
            // Adjusted 'flex-wrap' on the wrapper to keep the buttons stacked neatly when small
            const collectionWrapperClass = hasCollections ? 'w-full md:w-1/5 order-2 md:order-1 flex justify-start md:flex-col md:space-y-2 md:sticky md:top-28' : 'hidden';
            const itemsWrapperClass = hasCollections ? 'w-full md:w-4/5 order-1 md:order-2' : 'w-full';

            // --- 3. Assemble the final HTML ---
            return `
                <section id="work" class="py-10 md:py-16 animate-fade-in-up text-center">
                    <h2 class="text-4xl md:text-5xl font-extrabold mb-8 text-transparent bg-clip-text bg-gradient-to-r ${headingThemeClass}">
                        My Work
                    </h2>
                    <div id="work-category-tabs" class="flex flex-wrap justify-center mb-8 gap-2">
                        ${tabsHtml}
                    </div>
                    
                    <div class="flex flex-col ${flexClass} gap-8 max-w-7xl mx-auto items-start">
                        <div class="${collectionWrapperClass}">
                            ${collectionsHtml}
                        </div>
                        
                        <div id="work-items-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 ${itemsWrapperClass}">
                            </div>
                    </div>
                </section>
            `;
        }

                            GitHub
                        </a>
                        <a
                            href="mailto:shivani.gbhat@gmail.com"
                            class="inline-flex items-center justify-center px-8 py-3 font-bold text-white rounded-full transition-all duration-300 transform hover:scale-105 shadow-lg ${contactBtnClasses}"
                        >
                            <svg class="h-6 w-6 mr-2" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2" />
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                            </svg>
                            Gmail
                        </a>
                    </div>
                </section>
            `;
        }
        
        // Main function to update the page content based on navigation 
        function navigateTo(pageName) {
            currentPage = pageName;
            
            // Clear existing content and render the new page 
            mainContent.innerHTML = '';
            let contentHtml;
            switch(pageName) {
                case 'about':
                    contentHtml = renderAboutPage();
                    break;
                case 'work':
                    contentHtml = renderWorkPage();
                    break;
                case 'contact':
                    contentHtml = renderContactPage();
                    break;
                default:
                    contentHtml = renderAboutPage();
            }
            mainContent.innerHTML = contentHtml;
            
            // Special handling for the 'work' page to render initial items and attach listeners 
            if (pageName === 'work') {
                // 1. Render initial items using BOTH active category and collection
                renderWorkItems(activeWorkCategory, activeWorkCollection);
                
                // 2. Re-attach event listeners for MAIN work category tabs
                const categoryTabs = document.getElementById('work-category-tabs');
                if (categoryTabs) {
                    categoryTabs.addEventListener('click', (event) => {
                        const button = event.target.closest('.work-tab');
                        if (button) {
                            const newCategory = button.dataset.category;
                            if (newCategory !== activeWorkCategory) {
                                activeWorkCategory = newCategory;
                                activeWorkCollection = 'All'; // Reset collection when changing category
                                navigateTo('work'); // Re-render the entire work page
                            }
                        }
                    });
                }

                // 3. Attach event listener for SUB-collection tabs
                const subCollectionTabs = document.getElementById('sub-collection-tabs');
                if (subCollectionTabs) {
                    subCollectionTabs.addEventListener('click', (event) => {
                        const button = event.target.closest('.sub-collection-tab');
                        if (button) {
                            const newCollection = button.dataset.collection;
                            if (newCollection !== activeWorkCollection) {
                                activeWorkCollection = newCollection;
                                navigateTo('work'); // Re-render the entire work page
                            }
                        }
                    });
                }
            }

            // Update the active navigation link styles 
            updateNavLinks(pageName);
        }

        // Function to handle navigation link styling 
        function updateNavLinks(activePage) {
            const isDark = document.documentElement.classList.contains('dark');
            Object.keys(navLinks).forEach(pageName => {
                const link = navLinks[pageName];
                const isActive = pageName === activePage;

                // Reset all links 
                link.classList.remove('font-bold', 'text-black', 'text-white', 'text-white-glow', 'text-gray-500', 'dark:text-gray-300');

                if (isActive) {
                    link.classList.add('font-bold');
                    if (isDark) {
                        link.classList.add('text-white', 'text-white-glow');
                    } else {
                        link.classList.add('text-black');
                    }
                } else {
                    link.classList.add('text-gray-500', 'dark:text-gray-300');
                }
            });
        }
        
        // Function to toggle between light and dark themes 
        function toggleTheme() {
            const htmlElement = document.documentElement;
            const isDark = htmlElement.classList.toggle('dark');
            
            const h1Name = document.getElementById('name-heading');

            // Toggle the gradient classes for the name 
            if (h1Name) {
                h1Name.classList.remove('from-orange-500', 'via-orange-400', 'to-yellow-400', 'from-sky-400', 'to-teal-400');
                if (isDark) {
                    h1Name.classList.add('from-sky-400', 'to-teal-400');
                } else {
                    h1Name.classList.add('from-orange-500', 'via-orange-400', 'to-yellow-400');
                }
            }
            
            // Toggle visibility of the sun and moon icons 
            themeIcons.sun.classList.toggle('hidden', !isDark);
            themeIcons.moon.classList.toggle('hidden', isDark);

            // Re-render the current page content to update all gradients and button colors
            navigateTo(currentPage);
        }

        // Initialization function
        document.addEventListener('DOMContentLoaded', () => {
            // Check for system theme preference and set initial theme 
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            
            // Set initial icon visibility 
            const isDark = document.documentElement.classList.contains('dark');
            themeIcons.sun.classList.toggle('hidden', !isDark);
            themeIcons.moon.classList.toggle('hidden', isDark);

            // Attach event listeners for navigation links
            Object.keys(navLinks).forEach(pageName => {
                navLinks[pageName].addEventListener('click', (event) => {
                    event.preventDefault();
                    navigateTo(pageName);
                });
            });

            // Attach event listener for theme toggle button 
            themeToggleBtn.addEventListener('click', toggleTheme);
            
            // Attach event listener for closing the PDF viewer modal 
            closePdfBtn.addEventListener('click', closePdfViewer);

            // Render the initial page 
            navigateTo(currentPage);
        });
    </script>
</body>
</html>
